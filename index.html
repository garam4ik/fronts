<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoFront — игровая симуляция</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#15181e;color:#f4f6fa;font:14px system-ui,Arial,sans-serif;overflow:hidden}header{height:58px;background:#171a20;border-bottom:1px solid #353b45;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:12px;position:relative;z-index:500}.logo{font-size:20px;font-weight:850;font-style:italic}.sub{font-size:9px;letter-spacing:.8px;color:#adb5c2;font-style:normal;font-weight:500}button{background:#252a33;color:#f2f4f8;border:1px solid #414854;border-radius:9px;padding:9px 13px;font:inherit;cursor:pointer}#save{background:linear-gradient(110deg,#287bff,#ed3656);border:0;font-weight:750}#map{height:calc(100% - 58px);background:#282d34;cursor:crosshair}.leaflet-container{font:inherit}.leaflet-control-zoom a{background:#222730!important;color:#fff!important;border-color:#424853!important}
.topstats{position:absolute;z-index:450;top:67px;left:10px;right:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;pointer-events:none}.stat{background:#171a20ed;border:1px solid #3a404a;border-radius:9px;text-align:center;padding:8px 3px;font-weight:750;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.bottom{position:absolute;z-index:500;bottom:10px;left:10px;right:10px;max-width:720px;margin:auto;background:rgba(23,26,32,.96);border:1px solid #3b414b;border-radius:14px;padding:8px;box-shadow:0 8px 30px #0007;backdrop-filter:blur(12px)}.sides{display:grid;grid-template-columns:1fr 1fr;gap:7px}.side{font-weight:750;padding:11px}.side.active{outline:2px solid #e5eaf4;background:#303642}.hint{text-align:center;color:#cbd1db;font-size:11px;margin:7px 4px 1px}.warning{position:absolute;z-index:400;bottom:135px;left:50%;transform:translateX(-50%);background:#171a20e8;border:1px solid #424854;border-radius:9px;padding:7px 10px;font-size:11px;text-align:center;max-width:90%;pointer-events:none}#toast{display:none;position:absolute;z-index:1000;top:45%;left:50%;transform:translate(-50%,-50%);background:#171a20f5;border:1px solid #596271;border-radius:14px;padding:18px 24px;text-align:center;min-width:210px;box-shadow:0 10px 40px #0009;font-size:16px;font-weight:750}#toast small{display:block;font-size:12px;font-weight:500;color:#c3cad5;margin-top:5px}@media(max-width:550px){header{padding:0 9px}.logo{font-size:17px}.topstats{top:64px;left:5px;right:5px;gap:4px}.stat{font-size:10px;padding:7px 1px}.bottom{bottom:6px;left:6px;right:6px;padding:7px}.side{font-size:12px;padding:10px 4px}.hint{font-size:10px}.warning{bottom:130px;font-size:9px}}
</style></head><body>
<header><div class="logo">🌐 GeoFront <div class="sub">ВЫМЫШЛЕННАЯ ИГРОВАЯ СИМУЛЯЦИЯ</div></div><button id="save">Сохранить</button></header><div id="map"></div>
<div class="topstats"><div class="stat"><span class="dot" style="background:#4e91ff"></span><span id="bluePct">Украина</span></div><div class="stat"><span class="dot" style="background:#f34c55"></span><span id="redPct">Россия</span></div><div class="stat"><span class="dot" style="background:#9da5b2"></span>Серая зона</div><div class="stat"><span class="dot" style="background:#ffbf37"></span>Нейтральная</div></div>
<div class="warning">Вымышленная игровая раскраска · не реальные боевые действия</div><div id="toast"><span id="toastText">Считаю...</span><small id="toastSub"></small></div>
<div class="bottom"><div class="sides"><button class="side active" data-side="blue"><span class="dot" style="background:#4e91ff"></span>Украина</button><button class="side" data-side="red"><span class="dot" style="background:#f34c55"></span>Россия</button></div><div class="hint">Выбери сторону и зажми ПРАВУЮ кнопку мыши, чтобы обвести участок. Отпусти — начнётся игровой захват.</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=> {
const map=L.map('map',{zoomControl:true,doubleClickZoom:false,preferCanvas:true}).setView([49.0,34.5],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12,attribution:'© OpenStreetMap contributors'}).addTo(map);
const colors={blue:'#4e91ff',red:'#f34c55'}, fills={blue:'rgba(78,145,255,.48)',red:'rgba(243,76,85,.45)'};
let side='blue',drawing=false,pts=[],preview=null,captures=[];
const drawn=L.featureGroup().addTo(map);
function toast(a,b){document.getElementById('toastText').textContent=a;document.getElementById('toastSub').textContent=b||'';document.getElementById('toast').style.display='block'}
function hideToast(){document.getElementById('toast').style.display='none'}
document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{side=b.dataset.side;document.querySelectorAll('[data-side]').forEach(x=>x.classList.toggle('active',x===b))});
// Embedded simplified country outlines: avoids fragile external GeoJSON downloads.
const ukraine=[[52.35,23.65],[52.1,24.2],[51.8,24.8],[51.5,25.4],[51.4,26.5],[51.7,27.3],[51.5,28.1],[51.6,29.2],[51.4,30.1],[51.6,30.9],[51.5,31.8],[51.3,32.7],[51.2,33.5],[51.5,34.2],[51.4,35.1],[51.2,35.8],[50.9,36.6],[50.5,37.2],[49.9,37.8],[49.3,38.1],[48.7,38.0],[48.2,37.7],[47.8,38.1],[47.1,37.5],[46.7,36.8],[46.3,35.5],[46.1,34.8],[46.2,33.5],[46.0,32.5],[46.3,31.8],[46.5,30.7],[46.4,29.7],[46.0,29.1],[45.5,29.6],[45.4,28.7],[46.0,28.2],[46.4,27.5],[47.0,27.2],[47.5,27.7],[48.1,28.2],[48.5,27.7],[48.7,26.5],[49.0,25.6],[49.5,24.9],[50.0,24.1],[50.6,23.8],[51.2,23.6]];
const russia=[[55.5,30.0],[56.0,32.0],[56.4,35.0],[56.0,38.0],[55.0,40.0],[54.0,42.0],[52.5,44.0],[51.5,46.0],[50.8,48.0],[50.2,50.0],[49.0,49.5],[48.4,47.5],[47.8,45.0],[47.2,43.0],[46.8,40.0],[47.5,38.0],[48.2,37.7],[48.7,38.0],[49.3,38.1],[49.9,37.8],[50.5,37.2],[50.9,36.6],[51.2,35.8],[51.4,35.1],[51.5,34.2],[51.3,32.7],[51.5,31.8],[51.6,30.9],[52.0,30.0],[53.0,29.5],[54.0,29.8]];
L.polygon(ukraine,{color:'#9cc8ff',weight:2,fillColor:colors.blue,fillOpacity:.28,interactive:false}).addTo(map);
L.polygon(russia,{color:'#ffb0b5',weight:2,fillColor:colors.red,fillOpacity:.22,interactive:false}).addTo(map);
function whichCountry(ll){let inUA=ll.lat>45.2&&ll.lat<52.5&&ll.lng>22&&ll.lng<40.5;let inRU=ll.lat>46.5&&ll.lat<57&&ll.lng>29&&ll.lng<51;return inUA?'Ukraine':(inRU?'Russia':null)}
function showCounts(){document.getElementById('bluePct').textContent='Украина '+captures.filter(c=>c.side==='blue').length;document.getElementById('redPct').textContent='Россия '+captures.filter(c=>c.side==='red').length}
function start(e){if(e.originalEvent.button!==2)return;const c=whichCountry(e.latlng);if(!c){toast('Обводи Украину или Россию','Начни контур внутри страны');setTimeout(hideToast,1300);return}drawing=true;pts=[e.latlng];if(preview)map.removeLayer(preview);preview=L.polyline(pts,{color:colors[side],weight:4,opacity:1,lineCap:'round',lineJoin:'round'}).addTo(map);map.dragging.disable();L.DomEvent.preventDefault(e.originalEvent)}
function move(e){if(!drawing)return;const ll=e.latlng;if(!whichCountry(ll))return;const last=pts[pts.length-1];if(map.distance(last,ll)<180)return;pts.push(ll);if(preview){map.removeLayer(preview);preview=L.polyline(pts,{color:colors[side],weight:4,opacity:1,lineCap:'round',lineJoin:'round'}).addTo(map)}}
function end(e){if(!drawing|| (e&&e.originalEvent&&e.originalEvent.button!==2))return;drawing=false;map.dragging.enable();if(preview){map.removeLayer(preview);preview=null}if(pts.length<5){pts=[];return}toast('Считаю...','Обрабатываю контур игровой территории');let coords=pts.slice();if(map.distance(coords[0],coords[coords.length-1])>500)coords.push(coords[0]);setTimeout(()=>{let poly=L.polygon(coords,{color:colors[side],weight:1.4,fillColor:colors[side],fillOpacity:.35,renderer:L.canvas()});poly.addTo(drawn);captures.push({side,layer:poly});showCounts();hideToast();pts=[];toast('Территория захвачена!','Это только игровая симуляция');setTimeout(hideToast,1300)},700)}
map.on('mousedown',start);map.on('mousemove',move);map.on('mouseup',end);map.getContainer().addEventListener('contextmenu',e=>e.preventDefault());map.getContainer().addEventListener('mouseleave',()=>{if(drawing)end()});
document.getElementById('save').onclick=()=>{const blob=new Blob([JSON.stringify({disclaimer:'Вымышленная игровая симуляция, не реальные боевые действия.',captures:captures.map(c=>({side:c.side,geojson:c.layer.toGeoJSON()}))},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='geofront-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
})();
</script></body></html>
