<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoFront — игровая карта</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<style>
:root{--bg:#101216;--panel:rgba(23,26,32,.96);--line:#343943;--muted:#aab1bd;--red:rgba(245,65,75,.52);--blue:rgba(55,137,255,.52);--gray:rgba(155,164,176,.5);--yellow:rgba(255,190,50,.52)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f1f3f7;font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
header{height:68px;background:#171a20;border-bottom:1px solid #363b45;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px}
.brand{font-weight:800;font-size:20px;font-style:italic;letter-spacing:.3px}.brand small{display:block;font-size:10px;font-weight:500;font-style:normal;color:#aab1bd;letter-spacing:1px}
button{color:#f1f3f7;background:#252a33;border:1px solid #3c424d;border-radius:10px;padding:10px 13px;font:inherit;cursor:pointer}button:hover{filter:brightness(1.15)}button.active{outline:2px solid #438bff;background:#293d5d}
.primary{background:linear-gradient(110deg,#287bff,#ed3656);border:0;font-weight:700}
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 12px;position:absolute;z-index:500;top:76px;left:12px;right:12px;pointer-events:none}
.stat{background:rgba(20,23,29,.91);border:1px solid #3a404a;border-radius:10px;text-align:center;padding:8px 4px;font-weight:750;backdrop-filter:blur(8px)}
.bullet{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
#map{height:calc(100dvh - 68px);min-height:480px;background:#252a31}
.leaflet-container{font:inherit}.leaflet-control-zoom a{background:#222730!important;color:#fff!important;border-color:#424853!important}
.bottom{position:absolute;z-index:600;bottom:14px;left:12px;right:12px;max-width:760px;margin:auto;background:var(--panel);border:1px solid #3b414b;border-radius:15px;padding:10px;box-shadow:0 8px 30px #0007;backdrop-filter:blur(12px)}
.sides{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.side{padding:10px 5px;font-weight:700}.tools{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}.tools button{flex:1;min-width:45px}.notice{font-size:11px;color:#d1d5dd;text-align:center;margin:9px 3px 1px}
#toast{position:absolute;z-index:700;top:135px;left:50%;transform:translateX(-50%);background:#171a20eF;border:1px solid #414752;border-radius:9px;padding:8px 12px;max-width:90%;text-align:center;display:none}
.leaflet-draw-toolbar a{background-color:#fff}
@media(max-width:600px){header{height:60px;padding:0 10px}.brand{font-size:18px}#map{height:calc(100dvh - 60px)}#stats{top:68px;left:7px;right:7px;gap:5px}.stat{font-size:12px;padding:7px 2px}.bottom{bottom:8px;left:7px;right:7px;padding:8px}.side{font-size:12px;padding:9px 2px}.tools button{padding:9px 6px}.notice{font-size:10px}}
</style>
</head>
<body>
<header>
 <div class="brand">🌐 GeoFront <small>ИГРОВАЯ КАРТА · НЕ РЕАЛЬНЫЕ ДАННЫЕ</small></div>
 <button id="settings" title="Настройки">⚙</button>
 <button class="primary" id="save">Сохранить PNG</button>
</header>
<div id="map"></div>
<div id="stats">
 <div class="stat"><span class="bullet" style="background:#4e91ff"></span><span id="bluePct">0%</span></div>
 <div class="stat"><span class="bullet" style="background:#f34c55"></span><span id="redPct">0%</span></div>
 <div class="stat"><span class="bullet" style="background:#9da5b2"></span><span id="grayPct">0%</span></div>
 <div class="stat"><span class="bullet" style="background:#ffbf37"></span><span id="yellowPct">0%</span></div>
</div>
<div id="toast"></div>
<div class="bottom">
 <div class="sides">
  <button class="side" data-side="red"><span class="bullet" style="background:#f34c55"></span>Россия</button>
  <button class="side active" data-side="blue"><span class="bullet" style="background:#4e91ff"></span>Украина</button>
  <button class="side" data-side="gray"><span class="bullet" style="background:#9da5b2"></span>Серая</button>
  <button class="side" data-side="yellow"><span class="bullet" style="background:#ffbf37"></span>Нейтр.</button>
 </div>
 <div class="tools">
  <button id="drawPoly" title="Рисовать область">⬠ Область</button>
  <button id="drawLine" title="Рисовать линию">✎ Линия</button>
  <button id="undo" title="Отменить">↶</button>
  <button id="erase" title="Ластик">⌫ Ластик</button>
  <button id="clear" title="Очистить раскраску">Очистить</button>
 </div>
 <div class="notice">⚠ Вымышленная игровая симуляция. Цвета и проценты — только ваши рисунки; карта не показывает реальные боевые действия или реальный контроль территорий.</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script>
(() => {
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([48.7,31.2],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12,attribution:'© OpenStreetMap contributors'}).addTo(map);
const colors={red:'#f34c55',blue:'#4e91ff',gray:'#9da5b2',yellow:'#ffbf37'};
const fills={red:'rgba(243,76,85,.48)',blue:'rgba(78,145,255,.48)',gray:'rgba(157,165,178,.48)',yellow:'rgba(255,191,55,.48)'};
let side='blue',eraseMode=false,activeTool=null,history=[],shapes=[];
const drawn=L.featureGroup().addTo(map);
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2400)}
function styleFor(s){return {color:colors[s],weight:3,opacity:.95,fillColor:colors[s],fillOpacity:.48}}
function snapshot(){history.push(drawn.toGeoJSON());if(history.length>40)history.shift()}
function restore(obj){drawn.clearLayers();L.geoJSON(obj,{style:f=>styleFor(f.properties?.side||'blue'),pointToLayer:(f,ll)=>L.circleMarker(ll,{...styleFor(f.properties?.side||'blue'),radius:8})}).eachLayer(l=>{l.feature=l.feature||{};l.feature.properties=l.feature.properties||{};drawn.addLayer(l);l._side=l.feature.properties.side||'blue';l.on('click',eraseClick)})}
function eraseClick(e){if(!eraseMode)return;snapshot();drawn.removeLayer(e.target);updateStats()}
function addLayer(layer){layer._side=side;layer.feature=layer.feature||{type:'Feature',properties:{}};layer.feature.properties={...(layer.feature.properties||{}),side};layer.setStyle(styleFor(side));layer.on('click',eraseClick);drawn.addLayer(layer);updateStats()}
document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{side=b.dataset.side;eraseMode=false;document.querySelectorAll('[data-side]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('erase').classList.remove('active');toast('Выбрана сторона: '+b.textContent.trim())});
const polygon=new L.Draw.Polygon(map,{shapeOptions:{color:colors.blue,weight:3,fillOpacity:.48},allowIntersection:false});
const polyline=new L.Draw.Polyline(map,{shapeOptions:{color:colors.blue,weight:8,opacity:.6}});
document.getElementById('drawPoly').onclick=()=>{eraseMode=false;activeTool='poly';polygon.setOptions({shapeOptions:styleFor(side)});polygon.enable();toast('Нажимай точки на карте, двойной клик — завершить')};
document.getElementById('drawLine').onclick=()=>{eraseMode=false;activeTool='line';polyline.setOptions({shapeOptions:{color:colors[side],weight:9,opacity:.62}});polyline.enable();toast('Нарисуй линию на карте, двойной клик — завершить')};
map.on(L.Draw.Event.CREATED,e=>{snapshot();const layer=e.layer;addLayer(layer);if(activeTool==='line')layer.setStyle({color:colors[side],weight:9,opacity:.62});updateStats()});
document.getElementById('erase').onclick=()=>{eraseMode=!eraseMode;document.getElementById('erase').classList.toggle('active',eraseMode);toast(eraseMode?'Ластик включён: нажимай на свои фигуры':'Ластик выключен')};
document.getElementById('undo').onclick=()=>{if(!history.length){toast('Пока нечего отменять');return}restore(history.pop());updateStats()};
document.getElementById('clear').onclick=()=>{if(confirm('Очистить все нарисованные области и линии?')){snapshot();drawn.clearLayers();updateStats()}};
function updateStats(){let count={red:0,blue:0,gray:0,yellow:0};drawn.eachLayer(l=>{count[l._side||l.feature?.properties?.side||'blue']++});let total=Object.values(count).reduce((a,b)=>a+b,0)||1;for(const k of Object.keys(count))document.getElementById(k+'Pct').textContent=(count[k]/total*100).toFixed(1).replace('.',',')+'%';}
document.getElementById('settings').onclick=()=>toast('Колёсико мыши — масштаб. Перетаскивай карту, чтобы перемещаться.');
document.getElementById('save').onclick=()=>{
 const data={type:'FeatureCollection',features:drawn.toGeoJSON().features.map(f=>{f.properties=f.properties||{};return f})};
 const blob=new Blob([JSON.stringify({mapCenter:map.getCenter(),zoom:map.getZoom(),features:data,disclaimer:'Вымышленная игровая симуляция, не реальные боевые действия.'},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='geofront-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 toast('Сохранение карты скачано в JSON');
};
map.on('draw:drawstart',()=>{snapshot()});
map.on('click',e=>{if(eraseMode){let hit=null;drawn.eachLayer(l=>{if(l.getBounds&&l.getBounds().contains(e.latlng))hit=l});if(hit){snapshot();drawn.removeLayer(hit);updateStats()}}});
updateStats();
})();
</script>
</body></html>
